name: Uppdatera data

on:
  schedule:
    - cron: '17 3 * * 1' # måndagar 03:17 UTC
  workflow_dispatch:
  push:
    branches: [hundevenlig]
    paths:
      - 'js/osm.js'
      - 'scripts/fetch-places.mjs'

permissions:
  contents: write

concurrency:
  group: hundevenlig-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-places.mjs
      - name: Commit om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          git diff --cached --quiet || git commit -m "Uppdatera places.json från OpenStreetMap"
          git push
